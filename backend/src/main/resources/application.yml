spring:
  application:
    name: appointments
  mvc:
    problemdetails:
      # Standard errors (validation, malformed JSON, ...) use RFC 9457 Problem Details.
      enabled: true
  jpa:
    # Keep database access inside service methods; no lazy loading during view rendering.
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
